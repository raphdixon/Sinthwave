  <polyline points="111,108 133,90 133,108 155,90 155,108 177,90 177,108 184,102" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
  <polyline points="111,112 122,112 122,107 133,107 133,112 144,112" fill="none" stroke="#E63900" stroke-width="2"/>

