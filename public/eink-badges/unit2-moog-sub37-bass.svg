  <text x="100" y="153" class="f-sans" font-size="22.5" fill="#000000" text-anchor="middle" letter-spacing="-0.2">MOOG SUB 37</text>

  <!-- Subtitle Pill -->
  <rect x="9" y="164" width="182" height="25" rx="4" fill="#E63900"/>
  <text x="100" y="181.5" class="f-mono" font-size="14.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">LADDER SUB BASS</text>
