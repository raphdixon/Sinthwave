  <text x="110" y="49" class="f-mono" font-size="8" fill="#000000">-24dB</text>
  <!-- Resonant Ladder Curve (peak at x=163, well clear of -24dB label) -->
  <path d="M 110 66 L 148 66 Q 157 66 161 48 Q 164 39 168 54 L 181 75" fill="none" stroke="#E63900" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="163" cy="45" r="3" fill="#000000"/>

