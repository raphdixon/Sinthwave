<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="800" height="800" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <style>
      .f-mono { font-family: 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace; font-weight: 900; }
      .f-sans { font-family: 'Arial Black', 'Impact', 'SF Pro Display', 'Helvetica Neue', sans-serif; font-weight: 900; }
    </style>
  </defs>
  <rect x="0" y="0" width="200" height="200" fill="#FFFFFF"/>
  <rect x="3" y="3" width="194" height="194" rx="6" fill="none" stroke="#000000" stroke-width="4"/>

  <!-- Top Header Block -->
  <rect x="3" y="3" width="194" height="29" rx="4" fill="#000000"/>
  <rect x="3" y="20" width="194" height="12" fill="#000000"/>
  <text x="11" y="22" class="f-mono" font-size="13" fill="#FFFFFF" letter-spacing="0.5">UNIT 04 // CH 05</text>
  <rect x="156" y="7" width="35" height="20" rx="3" fill="#FFFFFF"/>
  <text x="173.5" y="21" class="f-mono" font-size="12" fill="#000000" text-anchor="middle">PAD</text>

  <!-- Center Illustration Zone (y=32..111) -->
  <!-- Left: Minilogue OLED Oscilloscope Chord Wave (x=10..104, y=35..105) -->
  <rect x="10" y="35" width="94" height="70" rx="4" fill="#000000"/>
  <line x1="14" y1="71" x2="100" y2="71" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="57" y1="39" x2="57" y2="101" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="15" y="45" class="f-mono" font-size="8" fill="#FFFFFF">OLED SCOPE</text>
  <path d="M 14 73 C 21 49, 28 49, 35 73 C 42 96, 49 96, 56 71 C 63 47, 70 47, 77 71 C 84 96, 91 96, 99 71" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 14 73 C 19 59, 24 87, 30 69 C 36 52, 42 85, 48 69 C 54 53, 60 87, 66 69 C 72 52, 78 85, 84 69 C 90 53, 95 83, 99 71" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 2"/>

  <!-- Right Top: 4-Voice Polyphonic Chord Stack Bars -->
  <rect x="110" y="36" width="76" height="11" rx="2" fill="#000000"/><text x="114" y="44.5" class="f-mono" font-size="8.5" fill="#FFFFFF">V4:7th</text><rect x="110" y="49.5" width="64" height="11" rx="2" fill="#000000"/><text x="114" y="58.0" class="f-mono" font-size="8.5" fill="#FFFFFF">V3:5th</text><rect x="110" y="63" width="70" height="11" rx="2" fill="#000000"/><text x="114" y="71.5" class="f-mono" font-size="8.5" fill="#FFFFFF">V2:3rd</text><rect x="110" y="76.5" width="80" height="11" rx="2" fill="#000000"/><text x="114" y="85.0" class="f-mono" font-size="8.5" fill="#FFFFFF">V1:ROOT</text>

  <!-- Right Bottom: Chord Voicing Tag (min9 / maj7) -->
  <rect x="110" y="91" width="80" height="14" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="150" y="101.5" class="f-mono" font-size="9.5" fill="#000000" text-anchor="middle">min9 / maj7</text>

  <!-- Horizontal Divider -->
  <line x1="3" y1="111" x2="197" y2="111" stroke="#000000" stroke-width="3.5"/>

  <!-- Bottom Typography Stack (Main Title + Secondary Title + Subtitle) -->
  <text x="100" y="138" class="f-sans" font-size="22" fill="#000000" text-anchor="middle" letter-spacing="0.4">MINILOGUE</text>

  <!-- Secondary Title Row -->
  <line x1="12" y1="154.5" x2="32" y2="154.5" stroke="#000000" stroke-width="3.5"/>
  <text x="100" y="159" class="f-mono" font-size="13.5" fill="#000000" text-anchor="middle" letter-spacing="1.0">KORG KRONOS</text>
  <line x1="168" y1="154.5" x2="188" y2="154.5" stroke="#000000" stroke-width="3.5"/>

  <!-- Subtitle Pill -->
  <rect x="9" y="167" width="182" height="22" rx="4" fill="#000000"/>
  <text x="100" y="182.5" class="f-mono" font-size="13.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.0">4-VOICE POLY PADS</text>
</svg>